<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kel Commit Landing Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Loader Overlay (aria-hidden mencegah pembacaan oleh screen reader) -->
    <div id="loader" aria-hidden="true">
        <div class="loader-half loader-top">
            <div class="text-mask">
                <h1 class="loader-text" id="loader-text">KEL_COMMIT</h1>
            </div>
        </div>

        <div class="loader-divider">
            <div class="solid-line"></div>
            <div class="static-indicator">
                <div class="slot-machine">
                    <div class="slot-strip" id="slot-strip"></div>
                </div>
                <span class="slot-percent">%</span>
            </div>
            <div class="scissor-wrapper" id="scissor-wrapper">
                <div class="scissor">✂</div>
            </div>
            <span class="cut-text">CUT ALONG LINE</span>
        </div>

        <div class="loader-half loader-bottom">
            <div class="geometry-nodes-wrapper" id="geometry-wrapper">
                <div class="geo-shape circle"></div>
                <div class="geo-shape square"></div>
                <div class="geo-shape pill"></div>
                <div class="geo-shape diamond"></div>
                <div class="geo-shape triangle"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content">
        <h1>Selamat Datang di Landing Page</h1>
        <p>Konten utama kel_commit akan muncul di sini.</p>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
